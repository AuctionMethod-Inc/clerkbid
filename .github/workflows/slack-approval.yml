name: slack-approval

# The production gate. Branch protection on main requires this check.
#
# It passes only when, in the PR's Slack thread, a person approves the PR's
# current head commit after Claude's "ready <sha>" post, and the deploy window
# is open (or an approval from NOW_USERS says "now"). Who may approve is set by
# APPROVERS below: "*" = any full member of the workspace who typed in the
# thread; guests, bots and app posts never count. See
# docs/FEEDBACK_LOOP_PLAN.md section 4.6 and scripts/slack-approval-gate.mjs.
#
# pull_request_target (not pull_request) so the workflow definition and the
# gate script always come from main: a PR cannot change the gate that judges
# it. Nothing from the PR branch is checked out or executed here.
#
# To re-evaluate at merge time, re-run the latest run for the PR (GitHub
# "Re-run jobs"); re-runs keep the same head SHA association.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: slack-approval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  slack-approval:
    # Branch protection requires a check named exactly "slack-approval".
    name: slack-approval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Always main, never the PR head.
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Evaluate Slack approval
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # "*" = any person who typed a message in the PR's Slack thread (the
          # channel is public, so that means anyone who joined it). App and bot
          # posts never count. Decided by Daniel on 2026-10-16. To go back to
          # named approvers, list Slack user IDs here instead:
          # Daniel U2QG6THFA, Killian U04T8JF0G0P.
          APPROVERS: "*"
          # The Claude Slack app (U0BE6J7TD1Q). Its posts are attributed to the
          # person who ran Claude, with a "Sent using <@U0BE6J7TD1Q>" footer, so
          # the gate uses this to recognize "ready" posts and to refuse any
          # approval that came through the app rather than being typed.
          READY_POSTER: U0BE6J7TD1Q
          # Slack's own app_id for that app, on every post made through it. A
          # "ready" post counts only if it carries this, so nobody can forge
          # one by typing the app's mention. Required while APPROVERS is "*".
          # If the Claude Slack app is ever reinstalled, find the new ID in the
          # gate's log ("app_id=...") and update it here, in its own PR.
          READY_APP_ID: A08SF47R6P4
          # The app posts as whoever ran Claude, so the app ID alone only proves
          # "someone used the Claude app". A ready post must also be attributed
          # to someone who legitimately drives Claude (the routine runs as
          # Daniel; Killian may mention Claude in a thread), or any workspace
          # member could make one.
          READY_USERS: U2QG6THFA,U04T8JF0G0P
          # With APPROVERS "*", only these people may say "approve now" to skip
          # the deploy window; from anyone else it is a plain approval that
          # waits for the window. Daniel U2QG6THFA, Killian U04T8JF0G0P.
          NOW_USERS: U2QG6THFA,U04T8JF0G0P
          # The gate only reads threads in this channel.
          ALLOWED_CHANNEL: C0C9HLJ9H3Q
          WINDOW_TZ: America/New_York
          WINDOW_START: "23:30"
          WINDOW_END: "06:00"
        run: node scripts/slack-approval-gate.mjs
